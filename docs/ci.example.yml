# Copy to .github/workflows/ci.yml to enable CI (pushing workflow files needs a token with the `workflow` scope).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan history
        run: gitleaks detect --verbose --redact

  core-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test (mock agent, no API keys)
        run: agentval run --dataset sample --config mock-improved --db sqlite:///./ci.db --no-color

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
